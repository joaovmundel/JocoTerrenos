# JocoTerrenos Configuration (Spigot 1.5.2)

# Active language for messages (e.g., pt_BR, en_US)
language: pt_BR

# Prints extra diagnostic lines (fences placed, lands created/changed, database opened...) to the console and
# server.log. Leave false in production.
debug: false

# Database Settings
# The SQLite and MySQL drivers come bundled with the server (CraftBukkit/Spigot 1.5.2);
# PostgreSQL is not supported on this version.
database:
  # Database type: SQLITE or MYSQL
  type: SQLITE

  # Settings for SQLite (used when type=SQLITE)
  sqlite:
    # Database file name (it will be created in the plugin folder)
    filename: terrenos.db

  # Settings for MySQL (used when type=MYSQL)
  mysql:
    host: localhost
    port: 3306
    database: jocoterrenos
    username: root
    password: senha

# Protection Settings
protection:
  # Minimum time between "you cannot do that here" messages sent to the same player (in milliseconds).
  # Block interactions fire many times per second, so without it the chat would be flooded.
  message-cooldown-ms: 1500

# Land Settings
lands:
  # Worlds where lands can be bought (and where /voar works). An empty list means every world.
  # Names are compared ignoring case. Lands that already exist in other worlds stay protected.
  allowed-worlds:
    - world
  # Default land size (in blocks)
  default-size: 10
  # Maximum allowed size
  max-size: 100
  # Minimum allowed size
  min-size: 5
  # Minimum spacing between lands (in blocks)
  spacing-between-lands: 3
  # Highest price a player may ask when putting a land up for sale (/terreno vender)
  sale:
    max-price: 1000000000
  # Price per block for land purchase
  block-price: 1000.0
  # Material for placed fences (FENCE or NETHER_FENCE)
  fence-material: FENCE
  teleport:
    min-y: 0
    max-y: 255
    search:
      max-depth: 64
    void:
      platform:
        material: GLASS
