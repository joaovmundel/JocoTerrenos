name: JocoTerrenos
main: "${project.mainClass}"
version: "${project.version}"
description: "${project.description}"
author: "${project.author}"
depend: [Vault]

commands:
  cercar:
    description: Coloca cercas delimitando uma area com o jogador no centro
    usage: /cercar <area_em_m2>
    permission: jocoterrenos.cercar
    permission-message: Voce nao tem permissao para usar este comando!
  resizecerca:
    description: Redimensiona uma area de cercas existente
    usage: /resizecerca <tamanho_antigo> <tamanho_novo>
    permission: jocoterrenos.resizecerca
    permission-message: Voce nao tem permissao para usar este comando!
  removercerca:
    description: Remove cercas de uma area
    usage: /removercerca <tamanho>
    permission: jocoterrenos.removercerca
    permission-message: Voce nao tem permissao para usar este comando!
  terreno:
    description: Gerencia terrenos
    usage: /terreno <comprar|preco|listar|info|deletar|pvp|mobs|publico|tp|vender|cancelarvenda|adquirir|vendas>
    permission: jocoterrenos.terreno
    permission-message: Voce nao tem permissao para usar este comando!
  voar:
    description: Liga ou desliga o voo dentro dos seus terrenos
    usage: /voar
    permission: jocoterrenos.voar
    permission-message: Voce nao tem permissao para usar este comando!

permissions:
  jocoterrenos.voar:
    description: Permite usar /voar (voar dentro dos proprios terrenos, nos mundos onde se pode comprar terrenos)
    default: op
  jocoterrenos.terreno:
    description: Permite usar o comando /terreno (comprar e gerenciar os proprios terrenos)
    default: true
  jocoterrenos.cercar:
    description: Permite usar /cercar (ferramenta de teste, coloca cercas em qualquer lugar)
    default: op
  jocoterrenos.resizecerca:
    description: Permite usar /resizecerca (ferramenta de teste)
    default: op
  jocoterrenos.removercerca:
    description: Permite usar /removercerca (ferramenta de teste, remove cercas em qualquer lugar)
    default: op
  jocoterrenos.bypass:
    description: Ignora a protecao dos terrenos (construir, quebrar e interagir em qualquer terreno)
    default: op
  jocoterrenos.admin:
    description: Todas as permissoes administrativas do JocoTerrenos
    default: op
    children:
      jocoterrenos.cercar: true
      jocoterrenos.resizecerca: true
      jocoterrenos.removercerca: true
      jocoterrenos.bypass: true
