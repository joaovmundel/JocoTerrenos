name: JocoTerrenos
version: '1.0-SNAPSHOT'
main: io.github.joaovmundel.jocoTerrenos.JocoTerrenos
api-version: '1.21'
depend: [Vault]

commands:
  cercar:
    description: Coloca cercas delimitando uma área com o jogador no centro
    usage: /cercar <área_em_m²>
    permission: jocoterrenos.cercar
    permission-message: Você não tem permissão para usar este comando!
  resizecerca:
    description: Redimensiona uma área de cercas existente
    usage: /resizecerca <tamanho_antigo> <tamanho_novo>
    permission: jocoterrenos.resizecerca
    permission-message: Você não tem permissão para usar este comando!
  removercerca:
    description: Remove cercas de uma área
    usage: /removercerca <tamanho>
    permission: jocoterrenos.removercerca
    permission-message: Você não tem permissão para usar este comando!
  terreno:
    description: Gerencia terrenos
    usage: "§c/terreno <comprar|listar|info|deletar|pvp|mobs|publico|tp>"
    permission: jocoterrenos.terreno
    permission-message: "§cVocê não tem permissão para usar este comando!"

permissions:
  jocoterrenos.terreno:
    description: Permite usar o comando /terreno (comprar e gerenciar os próprios terrenos)
    default: true
  jocoterrenos.cercar:
    description: Permite usar /cercar (ferramenta de teste, coloca cercas em qualquer lugar)
    default: op
  jocoterrenos.resizecerca:
    description: Permite usar /resizecerca (ferramenta de teste)
    default: op
  jocoterrenos.removercerca:
    description: Permite usar /removercerca (ferramenta de teste, remove cercas em qualquer lugar)
    default: op
  jocoterrenos.bypass:
    description: Ignora a proteção dos terrenos (construir, quebrar e interagir em qualquer terreno)
    default: op
  jocoterrenos.admin:
    description: Todas as permissões administrativas do JocoTerrenos
    default: op
    children:
      jocoterrenos.cercar: true
      jocoterrenos.resizecerca: true
      jocoterrenos.removercerca: true
      jocoterrenos.bypass: true
