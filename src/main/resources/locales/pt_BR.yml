invalid-location: '&cLocalizacao invalida!'

# Ajuda
help.title: '&6&lJocoTerrenos &7- Ajuda'
help.lines:
  - '&7/terreno comprar [tamanho] [nome] &f- Compra um terreno'
  - '&7/terreno preco [tamanho] &f- Mostra o preco de um terreno NxN'
  - '&7/terreno listar &f- Lista seus terrenos'
  - '&7/terreno info [nome] &f- Informacoes do terreno atual ou pelo nome'
  - '&7/terreno deletar [nome] &f- Deleta um terreno'
  - '&7/terreno pvp [nome] &f- Alterna PvP'
  - '&7/terreno mobs [nome] &f- Alterna Mobs'
  - '&7/terreno publico [nome] &f- Alterna acesso publico'
  - '&7/terreno tp [nome] &f- Teleporta para um local seguro dentro do terreno'

# Cercas
cercar.usage: '&cUso: /cercar <area_em_m2>'
