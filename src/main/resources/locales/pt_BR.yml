terreno.preco.min: '{prefix}&cTamanho minimo: &e{min}'
terreno.preco.max: '{prefix}&cTamanho maximo: &e{max}'
terreno.preco.valor: '{prefix}&7Terreno de &f{size}&7x&f{size}&7: &6{price}'

# Venda
terreno.vender.usage1: '{prefix}&cUso: &6/terreno vender &e<nome> <valor>'
terreno.vender.usage2: '&7Exemplo: &6/terreno vender &bcasa &e50000'
terreno.vender.valor-invalido: '{prefix}&cValor invalido. Use um numero maior que zero, com ate 2 casas decimais, de no maximo &e{max}&c.'
terreno.vender.sucesso: '{prefix}&aO terreno &b{name} &aesta a venda por &6{price}&a.'
terreno.vender.dica: '&7Para comprar: &6/terreno adquirir &e{owner} {name}&7. Para desistir: &6/terreno cancelarvenda &e{name}&7.'
terreno.vender.aviso-entrada: '&7Enquanto estiver a venda, qualquer jogador pode entrar para conhecer o terreno.'
terreno.cancelarvenda.usage: '{prefix}&cUso: &6/terreno cancelarvenda &e<nome>'
terreno.cancelarvenda.sucesso: '{prefix}&aO terreno &b{name} &anao esta mais a venda.'
terreno.cancelarvenda.nao-esta-a-venda: '{prefix}&cO terreno &b{name} &cnao esta a venda.'
terreno.adquirir.usage1: '{prefix}&cUso: &6/terreno adquirir &e<dono> <nome>'
terreno.adquirir.usage2: '&7Ou fique dentro do terreno e use apenas &6/terreno adquirir&7.'
