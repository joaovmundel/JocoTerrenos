# Mensagens padrao (Portugues - Brasil)
# Use & para cores. Placeholders: {player}, {price}, {size}, {name}

prefix: '&6[Terreno]&r '

# Gerais
only-player: '&cEste comando so pode ser executado por um jogador!'
