# Textos do JocoTerrenos (Portugues - Brasil). Somente ASCII: a 1.5.2 nao lida bem com acentos.
#
# Cores:  &6 destaque e comandos   &e valores e argumentos   &b nomes de terrenos   &f numeros
#         &7 texto comum           &8 separadores e detalhes &a sucesso e ligado    &c erro e desligado
# {prefix} vira o valor da chave "prefix". \n quebra a linha.
#
# Nao altere locale-version. Quando uma versao nova do plugin trouxer textos novos, este arquivo e guardado
# como pt_BR.yml.vN.bak e substituido pelo novo; copie suas alteracoes do .bak se quiser mante-las.
locale-version: 5

prefix: '&8[&6Terrenos&8]&r '

# Gerais
only-player: '{prefix}&cApenas jogadores podem usar este comando.'
no-permission: '{prefix}&cVoce nao tem permissao para usar este comando.'
invalid-number: '{prefix}&cDigite um numero valido.'
invalid-size: '{prefix}&cO tamanho deve ser maior que zero.'
invalid-location: '{prefix}&cLocalizacao invalida.'

# Ajuda
help.title: '&8----- &6&lTerrenos &8- &7Comandos &8-----'
help.lines:
  - '&6/terreno comprar &e<tamanho> <nome> &8- &7Compra um terreno'
  - '&6/terreno preco &e<tamanho> &8- &7Mostra o &6preco &7de um terreno'
  - '&6/terreno listar &8- &7Lista os &bseus &7terrenos'
  - '&6/terreno info &e[nome] &8- &7Mostra as informacoes do terreno'
  - '&6/terreno pvp &e<nome> &8- &7Liga ou desliga o &cPvP'
  - '&6/terreno mobs &e<nome> &8- &7Liga ou desliga os &cmobs'
  - '&6/terreno publico &e<nome> &8- &7Deixa o terreno &aaberto &7ou &cprivado &7(entrada de visitantes)'
  - '&6/terreno tp &e<nome> &8- &7Teleporta para o terreno'
  - '&6/terreno vender &e<nome> <valor> &8- &7Coloca o terreno &da venda'
  - '&6/terreno cancelarvenda &e<nome> &8- &7Tira o terreno da venda'
  - '&6/terreno vendas &8- &7Lista os terrenos &da venda'
  - '&6/terreno adquirir &e[dono] [nome] &8- &7Compra um terreno &da venda'
  - '&6/terreno deletar &e<nome> &8- &7Apaga o terreno e as cercas'

# Cercas (ferramentas de teste, so para admins)
cercar.usage: '{prefix}&cUso: &6/cercar &e<tamanho>'
removercerca.usage: '{prefix}&cUso: &6/removercerca &e<tamanho>'
removercerca.example1: '&7Exemplo: &6/removercerca &e10'
removercerca.example2: '&7Remove as cercas de uma area de &f10&7x&f10 &7ao seu redor.'
resizecerca.usage: '{prefix}&cUso: &6/resizecerca &e<tamanho_antigo> <tamanho_novo>'
resizecerca.example1: '&7Exemplo: &6/resizecerca &e10 20'
resizecerca.example2: '&7Redimensiona uma area de &f10&7x&f10 &7para &f20&7x&f20&7.'
resizecerca.iguais: '{prefix}&cOs tamanhos sao iguais. Nada a alterar.'

fences.removed.success: '{prefix}&aCercas removidas!\n&7Area: &f{size}&7x&f{size} &8(&f{area} &7blocos&8)\n&7Cercas removidas: &e{count}'
fences.resize.success: '{prefix}&aArea {acao} com sucesso!\n&7Antes: &f{old}&7x&f{old} &8(&f{oldArea} &7blocos&8)\n&7Agora: &f{new}&7x&f{new} &8(&f{newArea} &7blocos&8)\n&7Cercas removidas: &e{removed} &8| &7colocadas: &e{placed}'
action.expandida: 'expandida'
action.reduzida: 'reduzida'

# Comprar
terreno.comprar.usage-title: ''
terreno.comprar.usage1: '{prefix}&cUso: &6/terreno comprar &e<tamanho> <nome>'
terreno.comprar.usage2: '&7Exemplo: &6/terreno comprar &e10 &bcasa'
terreno.comprar.nome-longo: '{prefix}&cO nome do terreno pode ter no maximo &e{max} &ccaracteres.'
terreno.comprar.tamanho-invalido-min: '{prefix}&cTamanho minimo: &e{min}'
terreno.comprar.tamanho-invalido-max: '{prefix}&cTamanho maximo: &e{max}'
terreno.comprar.preco: '{prefix}&7Preco do terreno: &6{price}'
terreno.comprar.sucesso: '{prefix}&aTerreno comprado com sucesso!'
terreno.comprar.dica-publico: '&7Qualquer jogador pode entrar nele. Para fechar a entrada: &6/terreno publico &e{name}&7.'
terreno.comprar.info-dono: '&7Dono: &e{player}'
terreno.comprar.info-terreno: '&7Terreno: &b{name}'
terreno.comprar.info-tamanho: '&7Tamanho: &f{size}&7x&f{size}'
terreno.comprar.falha: '{prefix}&cNao foi possivel comprar o terreno. Confira seu &esaldo&c, se o &enome &cainda nao existe e os valores digitados.'
terreno.comprar.mundo-invalido: '{prefix}&cNao e possivel comprar terrenos neste mundo. Mundos permitidos: &e{worlds}&c.'
terreno.comprar.area-indisponivel: '{prefix}&cArea indisponivel! O terreno precisa ficar a pelo menos &e{buffer} &cblocos de outros terrenos.'

# Listar
terreno.listar.vazio: '{prefix}&7Voce ainda nao tem terrenos. Use &6/terreno comprar&7.'
terreno.listar.titulo: '&8----- &6&lSeus terrenos &8-----'
terreno.listar.linha: '&8#&7{id} &b{name} &8| &f{size}&7x&f{size} &8| &7PvP {pvp} &8| &7Mobs {mobs}{sale}'
terreno.listar.venda: ' &8| &dA venda &6{price}'

# Info
terreno.info.nao-no-terreno: '{prefix}&7Voce nao esta dentro de nenhum terreno.'
terreno.info.nao-encontrado: '{prefix}&cTerreno nao encontrado.'
terreno.info.titulo: '&8----- &6&lTerreno &b{name} &8-----'
terreno.info.dono: '&7Dono: &e{owner}'
terreno.info.tamanho: '&7Tamanho: &f{size}&7x&f{size}'
terreno.info.localizacao: '&7Localizacao: &f{location}'
terreno.info.pvp: '&7PvP: {pvp}'
terreno.info.mobs: '&7Mobs: {mobs}'
terreno.info.publico: '&7Entrada de visitantes: {public}'
terreno.info.membros: '&7Membros: &f{count}'
terreno.info.venda: '&7Venda: {sale}'
terreno.info.venda-sim: '&dA venda por &6{price}'
terreno.info.venda-nao: '&8Nao esta a venda'

# Deletar
terreno.deletar.usage: '{prefix}&cUso: &6/terreno deletar &e<nome>'
terreno.deletar.sucesso: '{prefix}&aTerreno deletado. As cercas foram removidas.'
terreno.deletar.erro: '{prefix}&cNao foi possivel deletar o terreno.'

# PvP, mobs e entrada de visitantes
terreno.toggle.nao-dono: '{prefix}&cVoce nao e o dono deste terreno.'
terreno.toggle.erro: '{prefix}&cOcorreu um erro ao atualizar o terreno.'
terreno.toggle.pvp: '{prefix}&7PvP no terreno &b{name}&7: {status}'
terreno.toggle.mobs: '{prefix}&7Mobs no terreno &b{name}&7: {status}'
terreno.toggle.publico: '{prefix}&7Entrada de visitantes no terreno &b{name}&7: {status}'
terreno.pvp.usage: '{prefix}&cUso: &6/terreno pvp &e<nome>'
terreno.mobs.usage: '{prefix}&cUso: &6/terreno mobs &e<nome>'
terreno.publico.usage: '{prefix}&cUso: &6/terreno publico &e<nome>'

status.on: '&aON'
status.off: '&cOFF'
status.habilitado: '&aLigado'
status.desabilitado: '&cDesligado'
status.sim: '&aPermitida'
status.nao: '&cSomente dono e membros'

# Teleporte
terreno.tp.usage: '{prefix}&cUso: &6/terreno tp &e<nome>'
terreno.tp.sem-permissao: '{prefix}&cVoce nao pode se teleportar para este terreno.'
terreno.tp.sucesso: '{prefix}&aTeleportado para o terreno &b{name}&a.'
