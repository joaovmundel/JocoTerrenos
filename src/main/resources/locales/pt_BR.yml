terreno.adquirir.economia-indisponivel: '{prefix}&cA economia esta indisponivel no momento. Tente de novo mais tarde.'
terreno.adquirir.nome-em-uso: '{prefix}&cVoce ja tem terrenos chamados &b{name} &ce todas as variacoes numeradas. Renomeie ou delete um deles antes.'
terreno.adquirir.erro-pagamento: '{prefix}&cNao foi possivel concluir o pagamento. Nada foi cobrado.'
terreno.adquirir.erro-salvar: '{prefix}&cNao foi possivel transferir o terreno. Seu dinheiro foi devolvido.'
terreno.adquirir.sucesso: '{prefix}&aVoce comprou o terreno &b{name} &ade &e{seller} &apor &6{price}&a.'
terreno.adquirir.renomeado: '&7Voce ja tinha um terreno com esse nome, entao este agora se chama &b{name}&7.'
terreno.adquirir.aviso-vendedor: '{prefix}&e{buyer} &acomprou o seu terreno &b{name} &apor &6{price}&a.'
terreno.vendas.vazio: '{prefix}&7Nenhum terreno esta a venda no momento.'
terreno.vendas.titulo: '&8----- &6&lTerrenos a venda &8-----'
terreno.vendas.linha: '&8#&7{id} &b{name} &8| &e{owner} &8| &f{size}&7x&f{size} &8| &6{price} &8| &7{where}'
terreno.vendas.rodape: '&7Compre com &6/terreno adquirir &e<dono> <nome>&7, ou de dentro do terreno com &6/terreno adquirir&7.'

# Protecao
protection.denied: '{prefix}&cEste terreno pertence a &e{owner}&c. Voce nao pode fazer isso aqui.'
protection.pvp-disabled: '{prefix}&cO PvP esta desligado neste terreno.'
protection.private: '{prefix}&cO terreno de &e{owner} &ce privado. Somente o dono e os membros podem entrar.'
protection.expelled: '{prefix}&7Voce foi levado para fora do terreno de &e{owner}&7, que e privado.'
